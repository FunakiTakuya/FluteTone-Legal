title: FluteTone - フルート音出し練習
description: >-
  フルート初心者向けの無料音出し・ロングトーン練習アプリ「FluteTone」の使い方ガイドとサポート。
  ピッチ表示、キープ秒数、L0〜L3無料と FluteTone Pro。
url: "https://funakitakuya.github.io"
baseurl: "/FluteTone-Legal"
lang: ja
locale: ja_JP

theme: jekyll-theme-primer

plugins:
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
    values:
      image: /images/guide-hero.png

include:
  - sitemap.xml
  - sitemap.txt
  - robots.txt

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
